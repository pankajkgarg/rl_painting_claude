name: build-image
on:
  workflow_dispatch:
  push:
    paths: ["docker/Dockerfile", "env/*.py", ".github/workflows/image.yml"]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: jlumbroso/free-disk-space@main
        with: { tool-cache: true, android: true, dotnet: true, haskell: true, large-packages: true, docker-images: false, swap-storage: true }
      - name: move docker storage to /mnt (large volume)
        run: |
          sudo systemctl stop docker
          sudo mkdir -p /mnt/docker && echo '{"data-root":"/mnt/docker"}' | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker && df -h / /mnt
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/rlpaint:latest
